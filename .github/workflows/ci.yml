name: ci
on: [push, pull_request]

jobs:
  hft_gateway:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hft_gateway
    steps:
      - uses: actions/checkout@v4
      - uses: YosysHQ/setup-oss-cad-suite@v3
        with:
          version: '2026-07-19'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: python3 -m pip install -r requirements.txt
      - run: make lint
      - run: make sim
      - run: make
      - run: make formal
      - run: for t in host/test_*.py; do python3 $t || exit 1; done
      - uses: actions/upload-artifact@v4
        with:
          name: bitstream
          path: hft_gateway/build/*.fs
